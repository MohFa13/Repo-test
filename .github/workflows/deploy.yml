name: Deploy static site

# Builds the directory structure (in case files were committed flat at the
# repo root) and publishes the site to GitHub Pages on every push to main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Move any files that landed at the repo root into the expected folders.
      # Safe to keep even if your files are already organized (the `|| true`
      # guards make each move optional).
      - name: Organize files into directories
        run: |
          mkdir -p css js assets

          # --- CSS ---
          for f in tokens.css layout.css chapters.css; do
            [ -f "$f" ] && mv -f "$f" css/ || true
          done

          # --- JS ---
          for f in icons.js content.js scene.js loops.js story.js interactions.js tweaks-app.jsx; do
            [ -f "$f" ] && mv -f "$f" js/ || true
          done

          # --- Assets (images) ---
          for f in keyart-hero.png depth-*.png grain.png; do
            [ -f "$f" ] && mv -f "$f" assets/ || true
          done

          echo "Final structure:"
          ls -R . | head -n 60

      - name: Verify index.html is present
        run: test -f index.html || (echo "::error::index.html not found at repo root" && exit 1)

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
